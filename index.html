<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اسكربت أبو علاء</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1b0930,#05030a 60%);color:#f5eaff;font-family:Arial,Tahoma,sans-serif}.wrap{max-width:760px;margin:auto;padding:16px 10px}.brand{text-align:center;font-size:30px;font-weight:bold;color:#dfbdff;text-shadow:0 0 14px #8b35ff;margin:14px}.panel{border:1px solid #8b35ff;border-radius:20px;padding:14px;background:#08050ddd;box-shadow:0 0 18px #7928ff55}.login{max-width:430px;margin:9vh auto}label{display:block;margin:12px 0 6px;color:#d7b7ff;font-weight:bold}input{width:100%;padding:13px;border:1px solid #8b35ff;border-radius:12px;background:#10091a;color:white;font-size:17px}button{padding:12px 16px;border:1px solid #a05cff;border-radius:13px;background:#170725;color:white;font-size:16px;font-weight:bold;cursor:pointer}.primary{width:100%;margin-top:18px}.error{color:#ff657b;text-align:center;margin-top:8px;min-height:20px}.hidden{display:none!important}.topline{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:14px}.info{border:1px solid #7132c8;border-radius:12px;padding:10px;background:#0b0615;color:#d7b7ff;overflow-wrap:anywhere}.boardbox{border:1px solid #7831c7;border-radius:16px;padding:8px}.board{display:grid;grid-template-columns:minmax(80px,1fr) repeat(5,minmax(32px,1fr));gap:6px 4px;align-items:center}.mult{direction:ltr;text-align:left;font-size:clamp(12px,3.3vw,18px);font-weight:bold;white-space:nowrap}.tick{color:#ff303e;font-size:19px}.apple{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid #b78bff55;min-width:0;font-size:clamp(19px,5vw,32px);box-shadow:inset 0 3px 4px #ffffff55,0 2px 4px #000}.closed{color:transparent;background:repeating-linear-gradient(0deg,#9b5426 0 5px,#b97838 6px 10px);border-color:#e4b785aa}.good{background:radial-gradient(circle at 35% 25%,#a5ff73,#18c65b 52%,#075f2e)}.bad{background:radial-gradient(circle at 35% 25%,#ff9d9d,#e51c2e 53%,#740515)}.controls{display:flex;gap:10px;margin-top:14px}.controls button{flex:1}.status{text-align:center;color:#caa7ff;min-height:24px;margin-top:12px}.footer{text-align:center;margin:24px 0;color:#a184c4;font-size:13px}@media(max-width:390px){.board{grid-template-columns:minmax(74px,1fr) repeat(5,minmax(28px,1fr));gap:4px 3px}.apple{font-size:20px}}
</style></head><body><div class="wrap">
<section id="loginScreen" class="panel login"><div class="brand">اسكربت أبو علاء</div><label for="userId">ID</label><input id="userId" autocomplete="off" placeholder="اكتب الـ ID هنا"><label for="password">كلمة السر</label><input id="password" type="password" placeholder="اكتب كلمة السر"><button class="primary" id="loginBtn">دخول</button><div id="loginError" class="error"></div></section>
<main id="gameScreen" class="hidden"><div class="brand">اسكربت أبو علاء</div><div class="topline"><div class="info">Online Users: <b>204</b></div><div class="info">Your ID: <b id="shownId">—</b></div></div><section class="panel"><div class="boardbox"><div id="board" class="board"></div></div><div class="controls"><button id="startBtn">START</button><button id="resetBtn">RESET</button></div><div id="status" class="status">اضغط START لعرض التفاحات تدريجيًا من تحت لفوق</div></section></main>
<div class="footer">صنع بواسطة MOHAMED ALAA</div></div>
<script>
const PASS="11223344", multipliers=["x349.68","x69.93","x27.97","x11.18","x6.71","x4.02","x2.41","x1.93","x1.54","x1.23"];
// عدد التفاحات البايظة محسوب من تحت لفوق: 1،1،1،1،2،2،2،3،3،4
const badCounts=[4,3,3,2,2,2,1,1,1,1];let outcomes=[],started=false,timers=[];
const board=document.getElementById("board"),statusEl=document.getElementById("status");
function makeOutcomes(){outcomes=badCounts.map(n=>{let s=new Set();while(s.size<n)s.add(Math.floor(Math.random()*5));return Array.from({length:5},(_,i)=>s.has(i)?"bad":"good")})}
function draw(){board.innerHTML="";multipliers.forEach((m,r)=>{let label=document.createElement("div");label.className="mult";label.innerHTML=m+' <span class="tick">✿</span>';board.appendChild(label);for(let c=0;c<5;c++){let a=document.createElement("div");a.className="apple closed";a.dataset.row=r;a.dataset.col=c;a.textContent="🍎";board.appendChild(a)}})}
function reset(){timers.forEach(clearTimeout);timers=[];started=false;makeOutcomes();draw();statusEl.textContent="تمت إعادة التفاحات لوضع الإغلاق";document.getElementById("startBtn").disabled=false}
function start(){if(started)return;started=true;document.getElementById("startBtn").disabled=true;statusEl.textContent="جارٍ إظهار التفاحات من تحت لفوق...";for(let step=0;step<10;step++){let r=9-step;timers.push(setTimeout(()=>{for(let c=0;c<5;c++){let a=board.querySelector('[data-row="'+r+'"][data-col="'+c+'"]'),kind=outcomes[r][c];a.className="apple "+kind;a.textContent="🍎";a.title=kind==="good"?"تفاحة سليمة":"تفاحة بايظة"}if(step===9)statusEl.textContent="اكتمل العرض — تجربة عشوائية للواجهة فقط، وليست توقعًا لنتائج أي لعبة حقيقية."},step*500))}}
document.getElementById("loginBtn").onclick=()=>{let id=document.getElementById("userId").value.trim(),p=document.getElementById("password").value;if(!id){document.getElementById("loginError").textContent="اكتب الـ ID الأول.";return}if(p!==PASS){document.getElementById("loginError").textContent="كلمة السر غير صحيحة.";return}document.getElementById("shownId").textContent=id;document.getElementById("loginScreen").classList.add("hidden");document.getElementById("gameScreen").classList.remove("hidden");reset()};
document.getElementById("startBtn").onclick=start;document.getElementById("resetBtn").onclick=reset;document.getElementById("password").onkeydown=e=>{if(e.key==="Enter")document.getElementById("loginBtn").click()};makeOutcomes();draw();
</script></body></html>
